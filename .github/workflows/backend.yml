name: backend

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu 러너에는 Docker가 있어 Testcontainers(PostGIS·Redis)가 그대로 돈다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 경계 검증(ModularityTests)·통합 테스트 전부 포함
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test

  # main에 올라온 코드만 운영(미니 PC)에 배포한다. 공개 저장소라 셀프 호스티드 러너 대신
  # GitHub 러너에서 jar를 만들고 배포 전용 SSH 키로 올린다. 남의 PR에는 시크릿이 없어 이 단계가 돌 수 없다.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar --console=plain
          cp build/libs/*-SNAPSHOT.jar "$RUNNER_TEMP/app-new.jar"

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # 미니 PC는 Windows OpenSSH. jar와 배포 스크립트를 올리고 스크립트가 교체·재시작·상태 확인·되돌리기를 한다.
      - name: Upload and deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          retry() { for i in 1 2 3 4; do "$@" && return 0; sleep 5; done; return 1; }
          retry scp -P "$PORT" $SSH_OPTS "$RUNNER_TEMP/app-new.jar" deploy/prod/deploy.cmd "$USER_NAME@$HOST:C:/Users/user/weathertalk-prod/"
          ssh -p "$PORT" $SSH_OPTS "$USER_NAME@$HOST" "C:\Users\user\weathertalk-prod\deploy.cmd"

      - name: Check public API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://bbangho-server.duckdns.org/api/v1/webhooks/kakao/unlink -X POST)
          echo "webhook without key -> $code"
          test "$code" = "401"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
