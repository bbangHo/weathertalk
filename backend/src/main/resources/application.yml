spring:
  application:
    name: weathertalk
  config:
    # 비밀값·외부 키는 환경 변수로 받는다. 로컬 개발은 저장소 루트(또는 backend)의 .env(git 제외)를 읽는다 — 변수 목록은 루트 .env.example.
    # bootRun·test의 작업 디렉터리는 backend라 ../.env가 저장소 루트다. 같은 이름의 OS 환경 변수가 있으면 그쪽이 이긴다.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  modulith:
    events:
      # 이벤트 발행 저장소 테이블을 자동 생성한다. 도메인 테이블은 Flyway가 관리한다.
      jdbc:
        schema-initialization:
          enabled: true
      # 기동 시 미완료 이벤트를 다시 발행한다 (레거시의 커밋 후 이벤트 유실 재발 방지)
      republish-outstanding-events-on-restart: true

management:
  # 운영 엔드포인트는 공개 포트와 분리한다 (contracts.md §4)
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, modulith


# ─────────────────────────────────────────────────────────────────────────────
# 운영 파라미터 (docs/to-be/README.md 운영 파라미터, 각 모듈 문서 §7)
# 초기값은 여기에만 둔다. 각 모듈 internal/config/<Module>Properties 가 @Validated로 검증하며,
# 빠지거나 범위를 벗어난 값이 있으면 기동이 실패한다.
# 바꾸는 법: 환경 변수(예: feeling.record-interval → FEELING_RECORDINTERVAL=30m) 또는 프로파일 yml로 덮어쓰고 재기동.
# 재기동 없는 갱신은 M8 운영 단계에서 Spring Cloud Config(+ 갱신 이벤트)나 DB 설정 테이블로 검토한다.
# ─────────────────────────────────────────────────────────────────────────────
shared:
  idempotency:
    # 요청 식별자 처리 결과 기본 보관 기간 (모듈별 값이 있으면 그 값을 쓴다. 예: community.idempotency-window)
    ttl: 24h
    # 첫 요청 '처리 중' 표시 유지 시간. 처리 중 인스턴스가 죽어도 이 시간 뒤엔 재시도 가능
    processing-lease: 30s
  scheduler-lock:
    # @SchedulerLock 에 lockAtMostFor 를 생략한 작업의 잠금 최대 유지 시간 (인스턴스가 죽었을 때 풀리는 시간)
    default-lock-at-most-for: PT10M

member:
  access-token-ttl: 1h
  refresh-token-ttl: 30d
  refresh-reuse-grace: 30s
  signup-ticket-ttl: 30m
  nickname:
    max-attempts: 10
    change-interval: 30d
    min-length: 2    # 미결 #1
    max-length: 10   # 미결 #1
  external-unlink:
    max-attempts: 8
    backoff: 1m
    retention: 30d
  token:
    # 접근·갱신 토큰 서명 비밀값(32자 이상). 운영은 환경 변수 MEMBER_TOKEN_SECRET 필수(prod 프로파일은 기본값 없음 → 비면 기동 실패).
    # 아래 기본값은 local·test 전용 개발 키다. 운영·스테이징에 쓰지 않는다.
    secret: ${MEMBER_TOKEN_SECRET:dev-only-insecure-token-secret-do-not-use-in-prod}

neighborhood:
  max-interest: 5
  current-refresh-min-interval: 10m
  max-accuracy-for-write: 500   # 미터
  active-member-window: 30d
  search-max-results: 20
  search-min-length: 1
  # 최근접 대표점 판정의 최대 거리(미터). 넓은 산간 면(수백 km²)의 외곽에서도 가장 가까운 대표점은 대개 15km 안쪽이라
  # 여유를 둔 값. 연안 바다 일부도 가까운 동네로 판정되는 것은 감수한다(ADR 0016). 이보다 멀면 판정 불가(바다 위·국외).
  max-nearest-distance: 20000

weather:
  mid-term-days: 10
  short-term:
    availability-delay: 10m
    max-staleness: 6h
    default-hours: 24
  observation:
    availability-delay: 10m   # 외부 확인 필요 (03 §9)
    max-staleness: 2h
  mid-term:
    availability-delay: 30m
  air:
    availability-delay: 20m
    max-staleness: 3h
    station-fallback-count: 3
    station-mapping-ttl: 30d
  uv:
    availability-delay: 30m
  external:
    timeout: 5s
    max-attempts: 3
    retry-backoff: 1s   # 지수 증가
  collect:
    failure-backoff: 5m
    wait-timeout: 3s
    lock-lease: 30s
    max-concurrency: 10
    not-ready-retry-interval: 5m
    not-ready-max-wait: 40m
  next-precip:
    horizon: 24h
  feels-like:
    winter-max-temp: 10.0   # ℃
    winter-min-wind: 1.3    # m/s
    summer-months: [5, 6, 7, 8, 9]
    summer-min-temp: 25.0   # ℃
  rain-phrase:
    rain-moderate: 3.0    # mm
    rain-heavy: 15.0
    rain-extreme: 30.0
    snow-moderate: 1.0    # cm
    snow-heavy: 5.0
  field-report:
    rain-threshold: 3
    rain-window: 30m
    valid-window: 60m
    min-interval: 30m
    daily-limit: 20
    cancel-window: 10m
    rain-suppress: 3h
    retention: 30d
  divergence:
    min-reports: 3
    min-share: 0.6
  precip-start:
    lead-window: 3h
    min-pop: 60   # %
    same-episode-tolerance: 2h
    episode-expiry: 12h
    dry-gap: 3h
  retention:
    observation: 7d   # 과거 관측 조회 보장(48시간) 이상
  day-night:
    day-start: "06:00"
    night-start: "18:00"
  # 외부 날씨 원천 연결(운영 파라미터 아님). 인증키가 비어 있어도 기동은 되고, 수집 시 '없음' 처리 + 경고 로그를 남긴다.
  # 인증키는 공공데이터포털에서 받은 '일반 인증키(Decoding)' 값을 환경 변수로 넣는다(코드·저장소에 두지 않는다).
  source:
    kma:
      # DATA_GO_KR: 공공데이터포털(serviceKey) / API_HUB: 기상청 API허브(authKey, base-url은 https://apihub.kma.go.kr/api/typ02/openApi)
      provider: DATA_GO_KR
      base-url: https://apis.data.go.kr/1360000
      # 필요: 기상청_단기예보 조회서비스, 기상청_중기예보 조회서비스, 기상청_생활기상지수 조회서비스(자외선) 활용신청
      service-key: ${WEATHER_KMA_SERVICE_KEY:}
    air-korea:
      base-url: https://apis.data.go.kr/B552584
      # 필요: 한국환경공단_에어코리아_대기오염정보, 한국환경공단_에어코리아_측정소정보 활용신청
      service-key: ${WEATHER_AIRKOREA_SERVICE_KEY:}
    jobs:
      # 사전 갱신·중기 정기 수집·정리 정기 작업 등록 여부
      enabled: true

feeling:
  neighborhood-window: 2h
  min-group-records: 5
  record-interval: 1h
  neighborhood:
    min-display-records: 3
    feedback-weight: 1.0
  feedback:
    max-shown-age: 1h
  snapshot:
    max-age: 90m
    backfill-window: 24h
    backfill-interval: 1h   # 미확보 스냅샷 백필 주기(스펙 §7에 없는 키, 04 §11 구현 메모)
  past-lookup-limit: 48h
  # 고정 기준표 (BR-FEL-18): 원 기온(℃, 체감온도 아님) → 온도 태그. 그룹별로 7·6·5·4·3·2단계 하한(이상)을 순서대로, 못 미치면 1단계
  reference-table:
    heat-sensitive: [29, 25, 22, 17, 12, 6]
    normal: [32, 27, 23, 17, 13, 8]
    cold-sensitive: [35, 29, 24, 17, 14, 10]
  mapping:
    enabled: false   # 체감 매핑 기능 플래그. 재계산 배치는 꺼져 있어도 돌아 버전을 쌓는다. 셀 충족률·적중률을 보고 켠다
    schedule: "0 0 4 * * *"   # 매일 04:00 (Asia/Seoul)
    lookback: 365d
    min-samples: 30
    feedback-weight: 0.5
    temp-min: -15
    temp-max: 35
    temp-bin-width: 2
    humidity-bins: [40, 70]
    wind-bins: [2.0, 5.0]
    max-dropped-ratio: 0.2
    retained-versions: 10
    # 계절 구분(BR-FEL-14): 1~12월을 각각 한 계절에
    seasons:
      spring: [3, 4, 5]
      summer: [6, 7, 8]
      autumn: [9, 10, 11]
      winter: [12, 1, 2]
  comparison:
    large-diff: 2
  calibration:
    schedule: "0 30 4 * * *"   # 매일 04:30 (Asia/Seoul, 매핑 재계산 04:00 직후)
    lookback: 90d
    min-records: 20
    feedback-weight: 0.5
    min-margin: 0.5
    cooldown: 30d
    decline-cooldown: 90d
    offer-ttl: 14d
  my-records:
    period: 30d
  my-pattern:
    min-records: 5
    tendency-threshold: 0.5

outfit:
  layering-gap: 2
  # 옷차림 매핑표 (04 옷 추천 §3 초안). 온도 태그 1~7단계가 모두 있어야 기동된다. 문구 최종안은 디자인과 확정(Q-O2)
  table:
    version: "2026-10-draft"
    layering-guide: "일교차가 커요. 벗고 입기 쉬운 겉옷을 챙기세요."
    rain-accessories: [우산, 방수 신발]
    snow-accessories: [우산, 미끄럼 방지 신발]
    levels:
      - level: 1
        outer: [롱패딩, 두꺼운 패딩]
        top: [기모 내의, 두꺼운 니트]
        bottom: [기모 바지]
        accessories: [목도리, 장갑, 귀마개]
        guide: "가장 두꺼운 옷으로 단단히 챙겨 입으세요."
      - level: 2
        outer: [패딩, 두꺼운 코트]
        top: [니트, 기모 맨투맨]
        bottom: [기모 바지, 두꺼운 면바지]
        accessories: [목도리]
        guide: "두꺼운 겉옷이 필요해요."
      - level: 3
        outer: [코트, 가죽 재킷, 경량 패딩]
        top: [니트, 맨투맨]
        bottom: [청바지, 면바지]
        accessories: []
        guide: "겉옷을 꼭 챙기세요."
      - level: 4
        outer: [얇은 재킷, 가디건]
        top: [긴소매 셔츠, 얇은 니트]
        bottom: [청바지, 면바지]
        accessories: []
        guide: "가벼운 겉옷 하나면 충분해요."
      - level: 5
        outer: [얇은 셔츠(필요 시)]
        top: [반소매, 얇은 긴소매]
        bottom: [면바지, 얇은 바지]
        accessories: []
        guide: "가볍게 입으세요."
      - level: 6
        outer: []
        top: [반소매, 린넨 셔츠]
        bottom: [반바지, 얇은 바지]
        accessories: [모자]
        guide: "시원한 옷을 입으세요."
      - level: 7
        outer: []
        top: [민소매, 통기성 좋은 반소매]
        bottom: [반바지]
        accessories: [모자, 양산, 물]
        guide: "최대한 시원하게 입고 물을 챙기세요."

community:
  max-images: 4
  post:
    min-length: 1
    max-length: 1000
  comment:
    max-length: 200
    page-size: 30
  image:
    max-file-size: 10MB
    # HEIC는 서버가 디코딩할 수 없어(순수 자바 판독기 없음) 뺐다. 앱이 올리기 전에 JPEG로 바꾼다(05 §10 구현 메모).
    allowed-types: [image/jpeg, image/png, image/webp]
    max-dimension: 2048
    orphan-ttl: 24h
    cleanup-interval: 1h
    upload-url-ttl: 10m
    view-url-ttl: 6h
    jpeg-quality: 0.85
  feeling-attach-window: 3h
  feed:
    page-size: 20
    max-page-size: 50
  popular:
    window: 24h
    min-likes: 1
    size: 5
  idempotency-window: 24h
  admin-deletion:
    reason-max-length: 200
  # 사진 객체 저장소(SeaweedFS, S3 API) 연결(운영 파라미터 아님). 값은 루트 .env의 S3_* 환경 변수로 받는다.
  # 주소·키가 비어 있어도 기동은 되고, 사진 업로드는 '일시적으로 사용할 수 없음'으로 응답한다(게시글·피드는 동작).
  storage:
    # 백엔드가 접근하는 내부 주소(path-style). 로컬 compose: http://localhost:8333
    endpoint: ${S3_ENDPOINT:}
    # 사전 서명 주소의 기준 주소 — 앱이 직접 올리고 받는 주소. 비면 endpoint와 같다.
    # 서명에 호스트·경로가 들어가므로 프록시는 경로 접두어 없이 전용 호스트로 두고 Host 헤더를 그대로 넘겨야 한다.
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:weathertalk-images}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}

notification:
  cooldown: 3h
  quiet-hours:
    start: "22:00"
    end: "07:00"
  timezone: Asia/Seoul
  daily:
    time-unit: 10m
    max-times: 3
    default-time: "07:00"
    forecast-span: 12h
    prepare-ahead: 15m
    max-delay: 30m
  event:
    max-delay: 30m
  comment:
    cooldown: 1h
  departure:
    max-times: 3
  subscription:
    max-per-device: 3
  send:
    batch-size: 500
    concurrency: 4
    max-retries: 2
    retry-backoff: 30s
    invalid-token-codes: [UNREGISTERED, SENDER_ID_MISMATCH, INVALID_ARGUMENT]
  device:
    stale-after: 60d
    purge-after: 30d
    push-token-max-length: 4096
  delivery-log:
    retention: 30d
  message:
    title-max-length: 40
    body-max-length: 160
  test:
    enabled: true   # prod 프로파일에서 false로 고정 (아래)
    rate-limit:
      max-count: 10
      period: 1h

home:
  section-timeout: 2s
  popular-posts-count: 5

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  # 운영 DB·Redis 접속은 환경 변수로 받는다(없으면 연결 실패로 기동이 멈춘다). 로컬은 Docker Compose 자동 연결, 테스트는 Testcontainers 연결이 우선한다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}
member:
  token:
    # 운영은 개발용 기본 키를 쓰지 않는다. MEMBER_TOKEN_SECRET 이 없으면 빈 값 → 검증 실패로 기동 중단.
    secret: ${MEMBER_TOKEN_SECRET:}
notification:
  test:
    # 개발용 기능은 운영 프로파일에서 등록하지 않는다 (contracts.md §4)
    enabled: false

---
spring:
  config:
    activate:
      on-profile: staging
  # 운영 DB·Redis 접속은 환경 변수로 받는다(없으면 연결 실패로 기동이 멈춘다). 로컬은 Docker Compose 자동 연결, 테스트는 Testcontainers 연결이 우선한다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}
member:
  token:
    # 스테이징도 개발용 기본 키를 쓰지 않는다 (개발 전용 로그인은 스테이징에 등록되므로 키 유출 시 위조 위험이 더 크다).
    secret: ${MEMBER_TOKEN_SECRET:}
