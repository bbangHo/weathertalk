spring:
  application:
    name: weathertalk
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  modulith:
    events:
      # 이벤트 발행 저장소 테이블을 자동 생성한다. 도메인 테이블은 Flyway가 관리한다.
      jdbc:
        schema-initialization:
          enabled: true
      # 기동 시 미완료 이벤트를 다시 발행한다 (레거시의 커밋 후 이벤트 유실 재발 방지)
      republish-outstanding-events-on-restart: true

management:
  # 운영 엔드포인트는 공개 포트와 분리한다 (contracts.md §4)
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, modulith

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
